[project]
name = "predicate"
version = "1.0.0"
description = "Secure natural language to SQL compilation middleware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "openai>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.1",
    "redis>=5.0.1",
    "celery>=5.4.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient. is deprecated.*:DeprecationWarning",
    "ignore::UserWarning",
]

[tool.playwright]
browser = "chromium"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.61.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.8.0",
]
