name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.14
      - run: uv sync --frozen --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.14
      - run: uv sync --frozen --dev

      - name: BasedPyright
        run: uv run basedpyright app/

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: predicate_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis_cache:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.14
      - run: uv sync --frozen --dev

      - name: Pytest
        env:
          DATABASE_URL: postgresql://postgres:securepassword123@localhost:5432/predicate_db_test
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_AUTH: "true"
          OPENAI_API_KEY: sk-mock-key-for-testing-purposes-only
        run: uv run pytest -v -W ignore --ignore=tests/test_e2e.py

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Playwright E2E
        env:
          DATABASE_URL: postgresql://postgres:securepassword123@localhost:5432/predicate_db_test
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_AUTH: "false"
          OPENAI_API_KEY: sk-mock-key-for-testing-purposes-only
        run: uv run pytest tests/test_e2e.py -v
