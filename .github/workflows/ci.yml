name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.14
      - run: uv sync --frozen --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.14
      - run: uv sync --frozen --dev

      - name: BasedPyright
        run: uv run basedpyright app/

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: predicate_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis_cache:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.14
      - run: uv sync --frozen --dev

      - name: Pytest
        env:
          DATABASE_URL: postgresql://postgres:securepassword123@localhost:5432/predicate_db_test
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_AUTH: "true"
          OPENAI_API_KEY: sk-mock-key-for-testing-purposes-only
        run: uv run pytest -v -W ignore --ignore=tests/test_e2e.py

      - name: Install Playwright browsers
        run: |
          for i in 1 2 3; do
            uv run playwright install chromium --with-deps && exit 0
            echo "::warning::playwright browser install attempt $i failed; retrying"
          done
          echo "::error::playwright browser install failed after 3 attempts"
          exit 1

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://postgres:securepassword123@localhost:5432/predicate_db_test
        run: |
          set -e
          if uv run which alembic >/dev/null 2>&1; then
            uv run alembic upgrade head
          else
            echo "Alembic not available; skipping migrations"
          fi

      - name: Start server for E2E
        env:
          DATABASE_URL: postgresql://postgres:securepassword123@localhost:5432/predicate_db_test
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_AUTH: "false"
          OPENAI_API_KEY: sk-mock-key-for-testing-purposes-only
        run: |
          set -e
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:8000/health > /dev/null 2>&1; then
            echo "::error::Server failed to start within 30 seconds"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

      - name: Playwright E2E
        env:
          DATABASE_URL: postgresql://postgres:securepassword123@localhost:5432/predicate_db_test
          REDIS_URL: redis://localhost:6379/0
          REQUIRE_AUTH: "false"
          OPENAI_API_KEY: sk-mock-key-for-testing-purposes-only
          CI: "1"
        run: uv run pytest tests/test_e2e.py -v
