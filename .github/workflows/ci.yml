name: Predicate Core CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    name: Execute Automated Test Matrix
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: securepassword123
          POSTGRES_DB: predicate_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis_cache:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Setup Python Runtime Environment
      run: uv python install 3.14

    - name: Install Dependencies
      run: uv sync --dev

    - name: Run Pytest Automation Matrix
      env:
        DATABASE_URL: postgresql://postgres:securepassword123@localhost:5432/predicate_db_test
        REDIS_URL: redis://localhost:6379/0
        REQUIRE_AUTH: true
        OPENAI_API_KEY: sk-mock-key-for-testing-purposes-only
      run: uv run pytest -v -W ignore
